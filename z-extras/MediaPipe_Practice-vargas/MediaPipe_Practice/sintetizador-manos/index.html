<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sintetizador de manos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Sintetizador de manos</h1>
  <p>Separa pulgar e índice: la mano derecha cambia la nota y la izquierda el eco. Activa el sonido de tu dispositivo.</p>
  <button id="iniciar">Iniciar cámara y sonido</button>
  <canvas id="lienzo"></canvas>
  <p>Nota: <span id="nota">0</span> Hz</p>
  <meter id="barraNota" min="200" max="800" value="200"></meter>
  <p>Espacio: <span id="espacio">0</span>%</p>
  <meter id="barraEspacio" min="0" max="1" value="0"></meter>
  <script type="module" src="script.js"></script>
</body>
</html>
